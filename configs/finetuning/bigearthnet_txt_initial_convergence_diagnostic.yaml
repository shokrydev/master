# Initial convergence diagnostic for 2B BigEarthNet.txt runs.
#
# This short run resolves the first 100 optimizer steps more densely than the
# 1000-step early diagnostic. It is not a primary training artifact.

trainer:
  max_steps: 100
  limit_val_batches: 1.0
  val_check_interval: 2
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  log_every_n_steps: 1

model:
  init_args:
    num_validation_generation_batches: 0
    validation_trace_sample_ids:
      - "8826437"  # captioning
      - "5819150"  # binary / presence
      - "506304"   # binary / adjacency
      - "8303198"  # mcq / country
      - "3031417"  # mcq / climate zone
      - "8457166"  # mcq / season
      - "5513687"  # bounding box / point
      - "5820049"  # bounding box / reference
    validation_trace_path: ${paths.output_dir}/validation_generation_trace.jsonl

data:
  init_args:
    validation_subset_size: 8192
    validation_subset_seed: 42
