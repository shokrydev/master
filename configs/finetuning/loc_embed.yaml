# Override for the loc_embed condition.

paths:
  satclip_checkpoint_path: ${oc.env:SATCLIP_L40_CHECKPOINT_PATH,data/satclip/satclip-vit16-l40.ckpt}

model:
  init_args:
    loc_mode: loc_embed
    satclip_checkpoint: ${paths.satclip_checkpoint_path}
    satclip_dim: 256
    num_location_tokens: 8
    location_embed_marker: "Scene coordinates:"
    location_projection_lr_multiplier: 5.0
