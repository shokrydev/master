# Smoke override for BigEarthNet.txt finetuning.
#
# Compose after configs/finetuning/bigearthnet_txt_shared.yaml and, if desired,
# loc_text.yaml or loc_embed.yaml.

trainer:
  max_steps: 5
  accumulate_grad_batches: 1

  limit_train_batches: 5
  limit_val_batches: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1

  log_every_n_steps: 1

model:
  init_args:
    max_new_tokens: 32
    num_validation_generation_batches: 1

data:
  init_args:
    batch_size: 1
    num_workers_dataloader: 0
