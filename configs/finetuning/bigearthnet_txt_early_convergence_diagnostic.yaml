# Early convergence diagnostic for 2B BigEarthNet.txt runs.
#
# This is a short matched fit run, not a primary training artifact. It keeps the
# same validation population as the 2B bounded monitor but logs more densely
# through the first 1000 optimizer steps.

trainer:
  max_steps: 1000
  limit_val_batches: 1.0
  val_check_interval: 100
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0

model:
  init_args:
    validation_trace_sample_ids:
      - "8826437"  # captioning
      - "5819150"  # binary / presence
      - "506304"   # binary / adjacency
      - "8303198"  # mcq / country
      - "3031417"  # mcq / climate zone
      - "8457166"  # mcq / season
      - "5513687"  # bounding box / point
      - "5820049"  # bounding box / reference
    validation_trace_path: ${oc.env:FINETUNING_OUTPUT_DIR,./outputs}/validation_generation_trace.jsonl

data:
  init_args:
    validation_subset_size: 8192
    validation_subset_seed: 42
