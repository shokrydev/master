# Shared GAIA finetuning config.
# Baseline run = this file alone.

seed_everything: 42

paths:
  output_dir: ${oc.env:FINETUNING_OUTPUT_DIR,./outputs}
  adapter_dir: ${oc.env:FINETUNING_ADAPTER_DIR,${paths.output_dir}/qlora_adapter}
  gaia_root: ${oc.env:GAIA_ROOT,data/gaia}

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed

  max_steps: 5000
  accumulate_grad_batches: 8

  val_check_interval: 250
  check_val_every_n_epoch: null

  log_every_n_steps: 10
  enable_progress_bar: true
  enable_checkpointing: false
  default_root_dir: ${paths.output_dir}

  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  enable_model_summary: true
  detect_anomaly: false

  num_nodes: 1
  strategy: auto

  callbacks:
    - class_path: src.callbacks.SaveQLoRAAdaptersCallback
      init_args:
        dirpath: ${paths.adapter_dir}
        monitor: val/loss
        mode: min

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 10
        mode: min
        min_delta: 0.001

    - class_path: lightning.pytorch.callbacks.RichProgressBar
      init_args:
        leave: true

model:
  class_path: src.lightning_modules.Qwen3VLModule
  init_args:
    model_name_or_path: unsloth/Qwen3-VL-2B-Instruct-unsloth-bnb-4bit
    adapter_dir: null
    max_seq_length: 2048

    lora_r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: null

    finetune_vision_layers: false
    finetune_language_layers: true
    finetune_attention_modules: true
    finetune_mlp_modules: true

    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.1

    max_new_tokens: 256
    system_prompt: You are a remote sensing image analysis assistant.

    loc_mode: no_loc

data:
  class_path: src.data_modules.GAIADataModule
  init_args:
    gaia_root: ${paths.gaia_root}

    batch_size: 1
    num_workers: 4
    pin_memory: true
    persistent_workers: true

    id_column: id
    caption_column: captions
    multi_caption: true

    lat_column: lat
    lon_column: lon

    user_prompt: Describe this remote sensing image in detail.
