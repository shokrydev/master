# Shared BigEarthNet.txt finetuning config.
#
# BigEarthNet.txt is the core dataset for the geolocation experiments with
# multispectral/SAR imagery. The default condition is no explicit location with
# enabled non-RGB conditioning; compose loc_text.yaml, loc_embed.yaml or the
# post-core loc_encoding.yaml or loc_additive_satclip.yaml development
# overrides for location-conditioned runs.

seed_everything: 42

paths:
  output_dir: ${oc.env:FINETUNING_OUTPUT_DIR,./outputs}
  adapter_dir: ${oc.env:FINETUNING_ADAPTER_DIR,${paths.output_dir}/qlora_adapter}
  bigearthnet_v2_lmdb_root: ${oc.env:BIGEARTHNET_V2_LMDB_ROOT,""}
  bigearthnet_txt_parquet_path: ${oc.env:BIGEARTHNET_TXT_PARQUET_PATH,""}
  bigearthnet_encoder_dir: ${oc.env:BIGEARTHNET_ENCODER_DIR,data/bigearthnet_encoders/mobilevit_s-all-v0.2.0}

trainer:
  accelerator: auto
  devices: auto
  precision: bf16-mixed

  max_epochs: 1
  accumulate_grad_batches: 1

  # Main full-epoch runs keep fitting separate from evaluation. Validation is
  # enabled only by explicit overrides such as the 2B convergence monitor.
  limit_val_batches: 0
  num_sanity_val_steps: 0

  log_every_n_steps: 10
  enable_progress_bar: true
  enable_checkpointing: false
  default_root_dir: ${paths.output_dir}

  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  enable_model_summary: true
  detect_anomaly: false

  num_nodes: 1
  strategy: auto

  callbacks:
    - class_path: src.callbacks.SaveQLoRAAdaptersCallback
      init_args:
        dirpath: ${paths.adapter_dir}
        best_dirpath: ${paths.output_dir}/qlora_adapter_best_val
        monitor: val/loss
        mode: min

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

    - class_path: lightning.pytorch.callbacks.RichProgressBar
      init_args:
        leave: true

model:
  class_path: src.lightning_modules.Qwen3VLModule
  init_args:
    model_name_or_path: unsloth/Qwen3-VL-2B-Instruct-unsloth-bnb-4bit
    adapter_dir: null
    max_seq_length: 2048

    lora_r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    lora_target_modules: null

    finetune_vision_layers: false
    finetune_language_layers: true
    finetune_attention_modules: true
    finetune_mlp_modules: true

    learning_rate: 2.0e-4
    weight_decay: 0.01
    warmup_ratio: 0.1

    max_new_tokens: 256
    system_prompt: You are a remote sensing image analysis assistant.

    loc_mode: no_loc
    non_rgb_conditioning: enabled
    non_rgb_encoder_dir: ${paths.bigearthnet_encoder_dir}
    non_rgb_encoder_feature_dim: null
    non_rgb_feature_mode: spatial_4x4
    non_rgb_spatial_pool_size: 4
    num_non_rgb_tokens: 16
    non_rgb_projection_lr_multiplier: 5.0

data:
  class_path: src.data_modules.BENTxTDataModule
  init_args:
    image_lmdb_file: ${paths.bigearthnet_v2_lmdb_root}
    metadata_file: ${paths.bigearthnet_txt_parquet_path}
    bands: S1S2-10m20m
    rgb_render_mode: copernicus
    rgb_quantile: 0.90
    # Preserve BEN.txt reference boundaries with Qwen's pretrained delimiter
    # tokens and express point/box coordinates on Qwen3-VL's 0-1000 grid.
    ref_token: ["<|object_ref_start|>", "<|object_ref_end|>"]
    # Qwen3-VL defines no point delimiter token; scale point coordinates while
    # removing only BEN.txt's generic <point> tags.
    point_token: ["", ""]
    grounding_format: qwen3_tokens
    use_location_redacted_captions: false
    location_redacted_caption_file: null
    batch_size: 128
    num_workers_dataloader: 12
