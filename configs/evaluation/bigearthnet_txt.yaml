# BigEarthNet.txt evaluation config.
#
# BigEarthNet.txt is the core multispectral/SAR evaluation dataset. Evaluation
# therefore defaults to enabled S1/S2 conditioning; RGB-only evaluation should
# be an explicit ablation override.

paths:
  output_dir: ${oc.env:EVAL_OUTPUT_DIR,./outputs/eval}
  adapter_dir: ${oc.env:EVAL_ADAPTER_DIR,""}
  bigearthnet_v2_lmdb_root: ${oc.env:BIGEARTHNET_V2_LMDB_ROOT,""}
  bigearthnet_txt_parquet_path: ${oc.env:BIGEARTHNET_TXT_PARQUET_PATH,""}
  bigearthnet_encoder_dir: ${oc.env:BIGEARTHNET_ENCODER_DIR,data/bigearthnet_encoders/mobilevit_s-all-v0.2.0}

trainer:
  default_root_dir: ${paths.output_dir}
  enable_checkpointing: false

model:
  class_path: src.lightning_modules.Qwen3VLModule
  init_args:
    adapter_dir: ${paths.adapter_dir}
    prediction_export_path: ${paths.output_dir}/predictions.jsonl
    # Generation stops at EOS; this cap accommodates the longer BEN.txt captions.
    max_new_tokens: 512
    non_rgb_conditioning: enabled
    non_rgb_encoder_dir: ${paths.bigearthnet_encoder_dir}
    non_rgb_encoder_feature_dim: null
    non_rgb_feature_mode: spatial_4x4
    non_rgb_spatial_pool_size: 4
    num_non_rgb_tokens: 16

data:
  class_path: src.data_modules.BENTxTDataModule
  init_args:
    image_lmdb_file: ${paths.bigearthnet_v2_lmdb_root}
    metadata_file: ${paths.bigearthnet_txt_parquet_path}
    bands: S1S2-10m20m
    rgb_render_mode: copernicus
    rgb_quantile: 0.90
    ref_token: ["<|object_ref_start|>", "<|object_ref_end|>"]
    point_token: ["", ""]
    grounding_format: qwen3_json
    use_location_redacted_captions: false
    location_redacted_caption_file: null
    coordinate_perturbation: null
    test_splits: [bench]
    batch_size: 1
    num_workers_dataloader: 4
